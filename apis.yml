aid: diagon-technologies
name: Diagon Technologies
description: >-
  Diagon Technologies operates Albus, an industrial equipment intelligence and
  procurement platform for North American manufacturing. Albus aggregates
  millions of industrial equipment listings so buyers can search by make, model,
  or specification, compare equipment specs, pricing, and availability side by
  side, and connect directly with sellers to request quotes. Sellers publish
  AI-powered catalogs, reach qualified buyer demand, and see live equipment
  searches in real time across categories such as subtractive manufacturing,
  forming, joining, surface treatment, and polymer processing, and OEMs
  including DMG Mori, Trumpf, Okuma, FANUC, and Mazak. Diagon is a Techstars
  portfolio company; this profile is maintained in the API Evangelist network.
